# Configuração do Streamlit (vale para o uso local e para o Render).
# O que é só do servidor (porta, 0.0.0.0, sem file watcher, erros resumidos) vai como flag em render_start.sh,
# para não mudar o fluxo de desenvolvimento local.

[server]
# Não tenta abrir navegador nem pergunta e-mail no 1º uso (no Render não há terminal interativo).
headless = true
# Atrás do proxy HTTPS do Render o navegador fala com a mesma origem (página e WebSocket no mesmo host),
# então as proteções padrão funcionam sem ajuste. Mantidas explícitas para ninguém desligá-las por engano.
enableCORS = true
enableXsrfProtection = true
# O app não tem upload de arquivos.
maxUploadSize = 1
# Fontes da identidade visual servidas de ./static (sem depender do Google Fonts em produção).
enableStaticServing = true

[browser]
gatherUsageStats = false

# ---------------------------------------------------------------------------------------------------------------
# Identidade visual: o app é a urna. A barra lateral é o teclado (grafite, sempre escuro); a área principal é a
# tela de cristal líquido (cinza-esverdeado claro). Verde = tecla CONFIRMA (seleção/decidido), laranja = CORRIGE.
# Tipos: Big Shoulders Display (títulos, sinalização), Public Sans (texto), Azeret Mono (números, como o boletim).
# Os tokens de cor são os mesmos de eleicoes/views/brand.py.

[theme]
font = "Public Sans, sans-serif"
headingFont = "Big Shoulders Display, Arial Narrow, sans-serif"
codeFont = "Azeret Mono, monospace"
headingFontWeights = [800, 800, 700, 700, 700, 600]
headingFontSizes = ["3.25rem", "2.5rem", "1.9rem", "1.45rem", "1.15rem", "1rem"]
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = false
chartCategoricalColors = ["#2E5E8C", "#CB6418", "#1D8A4C", "#7A4E92", "#B8322A", "#5B6660", "#B8901C", "#24807F"]
chartSequentialColors = ["#E3E9E3", "#C9D3CA", "#AFBDB1", "#94A698", "#7A9080", "#617A69", "#4A6453", "#354E3F",
                         "#22382C", "#16201B"]

[[theme.fontFaces]]
family = "Public Sans"
url = "app/static/fonts/PublicSans-normal-latin.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

